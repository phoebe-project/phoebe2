name: Release

on:
    workflow_dispatch:
    pull_request:
    release:
        types: [created]

jobs:
    build-sdist:
        name: Package source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Build sdist tarball
              run: |
                pipx run build --sdist
            - uses: actions/upload-artifact@v7
              with:
                name: cibw-sdist
                path: dist/*.tar.gz

    build-wheels:
        name: Build wheels on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-15]  # https://github.com/actions/runner-images#available-images
        steps:
            - name: Checkout the sources
              uses: actions/checkout@v7
            - name: Build wheels
              uses: pypa/cibuildwheel@v4.3.5
              env:
                # cibuildwheel >= 3 no longer builds PyPy or 32-bit Linux by default.
                # It does build free-threaded CPython (cp31Xt) by default: skip those
                # until the extensions declare free-threading support, and cp315 until
                # Python 3.15 is in the on_pr test matrix.
                CIBW_SKIP: "cp3??t-* cp315-*"
                # x86_64 wheels are cross-compiled on the arm64 runner.
                CIBW_ARCHS_MACOS: "x86_64 arm64"
            - uses: actions/upload-artifact@v7
              with:
                name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                path: ./wheelhouse/*.whl

    publish-to-pypi:
        if: github.event_name != 'pull_request'
        needs: [build-sdist, build-wheels]
        name: Publish release to PyPI
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/phoebe
        permissions:
            id-token: write
        steps:
            - name: Gather sdist tarball and wheels
              uses: actions/download-artifact@v8
              with:
                pattern: cibw-*
                path: dist
                merge-multiple: true
            - name: Publish package distributions to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1

name: Latest per-python environments

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same PR:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHOEBE_ENABLE_PLOTTING: 'FALSE'
  PHOEBE_UPDATE_PASSBAND_IGNORE_VERSION: 'TRUE'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # https://github.com/actions/runner-images#available-images
        os: [ubuntu-24.04, ubuntu-latest, macos-15, macos-15-intel, macos-latest]

    name: ${{ matrix.os }} python${{ matrix.python-version}}
    steps:
    - name: Checkout PHOEBE
      uses: actions/checkout@v7

    - name: Setup python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Update pip
      run: |
        python -m pip install --upgrade pip

    - name: Install phoebe optional modules
      run: |
        python -m pip install rebound "celerite2<0.3.3" scikit-learn emcee

    - name: Install PHOEBE from source
      run: |
        python -m pip install .

    - name: Install and run pipdeptree to see package dependencies
      run: |
        python -m pip install pipdeptree
        pipdeptree

    - name: Install jktebop
      env:
        # gfortran-14 is preinstalled on all runner images in the matrix:
        # https://github.com/actions/runner-images#available-images
        FC: gfortran-14
      run: |
        # Keele first; PHOEBE's mirror if Keele is down or does not return a valid archive
        if wget --timeout=10 --tries=2 --no-check-certificate -O jktebop-v44.tgz https://www.astro.keele.ac.uk/jkt/codes/jktebop-v44.tgz && tar -tzf jktebop-v44.tgz > /dev/null; then
          echo "jktebop: downloaded from www.astro.keele.ac.uk"
        else
          echo "jktebop: Keele failed, downloading from phoebe-project.org"
          wget --timeout=10 --tries=2 -O jktebop-v44.tgz https://phoebe-project.org/static/deps/jktebop-v44.tgz
        fi
        tar -xvzf jktebop-v44.tgz
        cd jktebop44
        ${{ env.FC }} -o jktebop jktebop.f
        echo $(pwd) >> $GITHUB_PATH
        cd ..

    - name: Test jktebop install
      run: |
        jktebop

    - name: Run tests
      run: |
        pytest --verbose --capture=no tests/tests/

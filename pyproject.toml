# PHOEBE build specification
# 
# Refer to the following document for specification:
#   https://packaging.python.org/en/latest/specifications/
# 
# Key specification is given here:
#   https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
# 
# Classifier strings are given here:
#   https://pypi.org/classifiers/

[project]
name = "phoebe"
dynamic = ["version"]  # single source of truth: phoebe/__init__.py:__version__
description = "PHOEBE: modeling and analysis of eclipsing binary stars"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
authors = [
    { name = "Andrej Prša", email = "aprsa@villanova.edu" },
    { name = "Kyle Conroy", email = "kyle.conroy@villanova.edu" },
    { name = "Angela Kochoska", email = "angela.kochoska@villanova.edu" },
    { name = "Martin Horvat", email = "martin.horvat@fmf.uni-lj.si" },
    { name = "Dave Jones", email = "djones@iac.es" },
    { name = "Michael Abdul-Masih", email = "michael.abdul-masih@eso.org" },
    { name = "Bert Pablo", email = "hpablo@aavso.org" },
    { name = "Joe Giammarco", email = "giammarc@eastern.edu" },
]
maintainers = [
    { name = "Kyle Conroy", email = "kyle.conroy@villanova.edu" },
    { name = "Andrej Prša", email = "aprsa@villanova.edu" },
]
keywords = [
    "phoebe",
    "science",
    "astronomy",
    "astrophysics",
    "binary stars",
    "eclipsing binary stars",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces"
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "ndpolator == 1.3.3",
    "tqdm",
    "corner",
    "requests",
    "python-socketio",
    "flask",
    "flask-cors",
    "flask-socketio",
    "gevent",
    "gevent-websocket",
]

[project.urls]
homepage = "https://phoebe-project.org"
repository = "https://github.com/phoebe-project/phoebe2"
documentation = "https://phoebe-project.org/docs"

[project.optional-dependencies]
test = ["pytest"]
extras = ["rebound", "celerite2<0.3.3", "scikit-learn", "emcee"]

[build-system]
requires = [
    "setuptools>=77",
    "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = [
    "client-server/phoebe-server",
    "client-server/phoebe-autofig",
]

[tool.setuptools.packages.find]
# every directory under phoebe/ is a package, including the data-only ones
# (atmospheres/tables/*, frontend/default_bundles) that have no __init__.py:
include = ["phoebe*"]
namespaces = true

[tool.setuptools.dynamic]
# read statically (ast) from the literal in phoebe/__init__.py; no import needed
version = {attr = "phoebe.__version__"}

[project.scripts]
phoebe-admin = "phoebe.cli.admin:main"
